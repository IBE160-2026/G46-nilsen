name: Live AI Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Hvilken live KI-suite skal kjøres?"
        required: true
        default: "occupation-golden"
        type: choice
        options:
          - occupation-golden
          - golden
          - stress
          - stress-full

jobs:
  live-ai-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require configured AI provider secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Live AI validation requires OPENAI_API_KEY or OPENROUTER_API_KEY as a GitHub Actions secret."
            exit 2
          fi

      - name: Run selected live suite
        shell: bash
        run: |
          case "${{ inputs.suite }}" in
            occupation-golden)
              npm run test-ai:occupation-golden
              ;;
            golden)
              npm run test-ai:golden
              ;;
            stress)
              npm run test-ai:stress
              ;;
            stress-full)
              npm run test-ai:stress:full
              ;;
            *)
              echo "::error::Unknown suite"
              exit 2
              ;;
          esac

      - name: Upload live AI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ai-validation-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            tests/reports/**
          if-no-files-found: ignore
          retention-days: 14
