name: Live AI Validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Hvilken live KI-suite skal kjøres?"
        required: true
        default: "occupation-golden"
        type: choice
        options:
          - occupation-golden
          - golden
          - stress
          - stress-full

jobs:
  live-ai-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check AI provider secret
        id: provider
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Live AI provider er konfigurert."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live AI validation ble ikke kjørt fordi OPENAI_API_KEY eller OPENROUTER_API_KEY ikke er konfigurert som GitHub Actions secret."
            echo "### Live AI Validation" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ Hoppet over: ingen provider-secret er konfigurert." >> "$GITHUB_STEP_SUMMARY"
            echo "Dette er en miljøforutsetning, ikke en testfeil i applikasjonen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run selected live suite
        if: steps.provider.outputs.available == 'true'
        shell: bash
        run: |
          case "${{ inputs.suite }}" in
            occupation-golden)
              npm run test-ai:occupation-golden
              ;;
            golden)
              npm run test-ai:golden
              ;;
            stress)
              npm run test-ai:stress
              ;;
            stress-full)
              npm run test-ai:stress:full
              ;;
            *)
              echo "::error::Unknown suite"
              exit 2
              ;;
          esac

      - name: Upload live AI reports
        if: always() && steps.provider.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-ai-validation-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            tests/test-results/**
            tests/reports/**
          if-no-files-found: warn
          retention-days: 14
