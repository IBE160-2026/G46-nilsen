name: One-time archive and prune legacy branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-prune-branches.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: single-main-branch-cleanup
  cancel-in-progress: false

jobs:
  archive-and-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout every reachable commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive ALL old tips in ONE recoverable tag, then remove old refs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Only main is allowed"; exit 1; }
          TAG="archive/branches-before-single-main-2026-11-25"
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune
          allowed=(
            'archive/pilot-ux-v20.11-before-live-2026-11-09'
            'audit/ibe160-final-quality-2026-11-20'
            'backup/main-before-ibe160-revision-20261120'
            'backup/main-before-source-help-fixes-20261120'
            'docs/final-live-verification-2026-11-09'
            'docs/ibe160-helhetlig-revisjon-20261118'
            'docs/submission-sync-2026-11-09'
            'feature/occupation-context'
            'fix/evidence-sources-20261120'
            'hotfix/v20.11.1-desktop-responsive'
            'hotfix/v20.11.2-topbar-finder-reset'
            'hotfix/v20.11.3-topbar-alignment'
            'hotfix/v20.11.4-history-logo-simulation-clean'
            'hotfix/v20.11.5-dark-sidebar-hover'
            'pilot-improvements-2026-10-28'
            'pilot-live-v1'
            'pilot-ux-v20.11'
            'predeploy-check-2026-10-28'
            'qa/final-prod-smoke-2026-11-09'
            'qa/live-ai-2026-11-08'
            'qa/live-golden-fixes-2026-11-09'
            'qa/live-timeout-final'
            'qa/source-retention-final'
            'qa/state-primary-law-ranking-2026-11-09'
          )
          declare -A permitted=()
          for name in "${allowed[@]}"; do permitted["$name"]=1; done

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin |
              sed '/^main$/d; /^HEAD$/d' | LC_ALL=C sort
          )
          echo "Branches to archive and remove: ${#branches[@]}"
          if (("${#branches[@]}" == 0)); then
            echo "Only main remains. Nothing to delete."
            exit 0
          fi
          for name in "${branches[@]}"; do
            [[ -n "${permitted[$name]:-}" ]] ||
              { echo "Unexpected branch: $name (abort without deleting)"; exit 1; }
          done

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG" || true
            echo "Existing archive tag found; verifying reachability before any deletes."
          else
            main_sha="$(git rev-parse refs/remotes/origin/main)"
            tree_sha="$(git rev-parse "${main_sha}^{tree}")"
            parents=(-p "$main_sha")
            message=$'Recoverable archive of the legacy branches before retaining only main.\nThis is an ARCHIVE of history, NOT a source-code merge or product activation.\n\n'
            for name in "${branches[@]}"; do
              sha="$(git rev-parse "refs/remotes/origin/$name")"
              parents+=(-p "$sha")
              message+="$name $sha"$'\n'
            done
            # The archived commit has main's exact file tree, with all old
            # branch heads as additional parents; every legacy commit remains reachable.
            archive_sha="$(printf '%s' "$message" | git -c user.name='Samtalestøtte archive' -c user.email='archive@users.noreply.github.com' commit-tree "$tree_sha" "${parents[@]}")"
            git -c user.name='Samtalestøtte archive' -c user.email='archive@users.noreply.github.com' tag -a "$TAG" -m 'Archive all 24 legacy branch tips before main-only cleanup' "$archive_sha"
            git push origin "refs/tags/$TAG"
            echo "Created recoverable archive tag: $TAG"
          fi

          archive_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          for name in "${branches[@]}"; do
            sha="$(git rev-parse "refs/remotes/origin/$name")"
            git merge-base --is-ancestor "$sha" "$archive_sha" || {
              echo "Archive does not contain branch $name ($sha) – nothing deleted."
              exit 1
            }
          done
          git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null ||
            { echo "Remote archive missing – nothing deleted"; exit 1; }
          echo "All branch tips verified reachable from remote archive tag."

          for name in "${branches[@]}"; do
            [[ "$name" != "main" ]] || exit 1
            git push origin --delete "$name"
          done

          remaining="$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')"
          if [[ "$remaining" != "main" ]]; then
            echo "Unexpected branch list after cleanup: $remaining"
            exit 1
          fi
          echo "SUCCESS: only main remains. Full old history preserved in $TAG."
