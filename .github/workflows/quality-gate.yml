name: Quality Gate

on:
  push:
    branches: [main, pilot-live-v1]
  workflow_dispatch:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Summarize strict golden coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('tests/AI-GOLDEN-CASES.json','utf8'));
          const cases=data.cases||[];
          const strict=cases.filter(x=>x.golden_group);
          const counts=strict.reduce((a,x)=>(a[x.golden_group]=(a[x.golden_group]||0)+1,a),{});
          console.log({totalGolden:cases.length, strictOccupationGolden:strict.length, groups:counts});
          NODE
