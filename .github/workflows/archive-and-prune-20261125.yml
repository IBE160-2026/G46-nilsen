name: One-time archival of merged working branches (25 Nov 2026)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-and-prune-20261125.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  archive-and-prune:
    if: github.repository == 'IBE160-2026/G46-nilsen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all branch commits with credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm merge state, archive tips, then delete exactly five obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Four completed fixes/docs PRs and this one-time cleanup PR (#20).
          # Keep main, pilot-ux-v20.11, archives and any unrelated branches.
          entries=(
            '16|fix/privacy-begge-false-positive-20261125'
            '17|fix/occupation-suggestion-context-20261125'
            '18|docs/final-documentation-audit-20261125'
            '19|chore/git-docs-cleanup-20261125'
            '20|chore/archive-merged-branches-20261125'
          )
          declare -a shas=()
          declare -a tags=()
          declare -a branches=()
          for entry in "${entries[@]}"; do
            IFS='|' read -r pr branch <<< "$entry"
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            merged="$(jq -r '.merged_at // empty' <<< "$pr_json")"
            head="$(jq -r '.head.ref' <<< "$pr_json")"
            sha="$(jq -r '.head.sha' <<< "$pr_json")"
            base="$(jq -r '.base.ref' <<< "$pr_json")"
            if [[ -z "$merged" || "$head" != "$branch" || "$base" != main ]]; then
              echo "::error::PR #$pr is not a verified merged PR of $branch into main"
              exit 1
            fi
            actual="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)"
            if [[ "$actual" != "$sha" ]]; then
              echo "::error::Branch $branch moved since PR #$pr; refusing deletion"
              exit 1
            fi
            git cat-file -e "${sha}^{commit}"
            tag="archive/merged-pr-${pr}-head-20261125"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              old_sha="$(git rev-parse "$tag^{}")"
              [[ "$old_sha" == "$sha" ]] || { echo "::error::Archive tag $tag points to unexpected commit"; exit 1; }
            fi
            branches+=("$branch")
            shas+=("$sha")
            tags+=("$tag")
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in "${!tags[@]}"; do
            if ! git show-ref --verify --quiet "refs/tags/${tags[$i]}"; then
              git tag -a "${tags[$i]}" "${shas[$i]}" -m "Preserve exact merged PR head ${branches[$i]} before branch cleanup"
            fi
            if ! git ls-remote --exit-code origin "refs/tags/${tags[$i]}" >/dev/null; then
              uploaded=false
              for attempt in 1 2 3; do
                if git push origin "refs/tags/${tags[$i]}"; then uploaded=true; break; fi
                echo "Retrying transient GitHub tag push ${tags[$i]} (attempt ${attempt})"
                sleep 3
              done
              [[ "$uploaded" == true ]] || { echo "::error::Could not archive ${tags[$i]}"; exit 1; }
            fi
          done

          # Do not delete anything until every old branch tip is archived remotely.
          for i in "${!tags[@]}"; do
            remote="$(git ls-remote origin "refs/tags/${tags[$i]}^{}" | cut -f1)"
            if [[ "$remote" != "${shas[$i]}" ]]; then
              echo "::error::Archive verification failed for ${tags[$i]}; no branches deleted"
              exit 1
            fi
          done

          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"
            current="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)"
            [[ "$current" == "${shas[$i]}" ]] || { echo "::error::Branch $branch changed during archival"; exit 1; }
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "Archived and deleted $branch as ${tags[$i]}"
          done

          git ls-remote --heads origin
